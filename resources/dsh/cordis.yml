# thihy-todolist DSH composition. Minimal agent tree: base LLM service (we
# register our own ThihyLlmAdapter wrapping client.ts invokeChat after boot),
# tool registry (we register our todo/content/drawing handlers), system prompt,
# session service + projection + JSONL persistence, agent factory, and the
# agent loop. NO bash/editor/sandbox/terminal tools — this is a TODO app, not a
# coding agent; only our own typed domain tools are exposed to the model.
# Configured agents: [] — we create agents programmatically via ctx.agents.create
# per AI invocation, so activation needs no provider adapter at boot time.

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: |-
      你是 thihy，一个内嵌于个人 TODO 列表应用中的 AI 助手。
      - 始终使用中文回复用户。
      - 当用户询问其任务或工作时，优先调用工具（todo.*、content.*、drawing.*）以基于真实数据作答；不要凭空编造任务或内容。
      - 执行破坏性操作（todo.delete、drawing.delete、content.restoreVersion）前，先说明你将要做什么，并等待用户明确同意。
      - 回答简洁，多用要点和短段落。

- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: sessions
  name: '@deepseek-ai/dsh-session'

# NOTE: dsh-session-persistence-jsonl is deliberately NOT mounted. It statically
# imports `createZstdDecompress` etc. from node:zlib, which only exists on
# Node 22.15+ — Electron 33 ships Node 20.18 and throws a SyntaxError on that
# import, failing the whole boot. Sessions run in-memory instead, which is
# fine here: runTurn creates a fresh agent per invocation and never resumes a
# session by id across restarts, so on-disk persistence is unused.

- id: agents
  name: '@deepseek-ai/dsh-agent'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []

# Token measurement service. Inject: sessionProjections (already mounted above).
# Injects `tokenMeter` onto ctx for any service that wants to budget context
# (compaction, pruner, agent-loop). Zero config — defaults are fine.
- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

# Deterministic tool-result pruning: when a tool result exceeds thresholdChars,
# keep headChars + marker + tailChars so the model still sees the framing and
# the most recent lines but the middle is dropped. Pairs with token-meter.
# Defaults: threshold 8192, head 4096, tail 1024 — fine for our use.
- id: tool-result-pruner
  name: '@deepseek-ai/dsh-compaction-tool-result-pruner'

# Automatic between-step compaction: when pressure > thresholdRatio (0.8 of
# model context) it asks the LLM to summarize the head, retaining the verbatim
# tail so the active work isn't lost. Inject: llm, tokenMeter, sessions — all
# present above. auto: true engages the pressure-driven path; without it the
# engine only runs when the session/compact event fires explicitly.
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    auto: true

# Agent's INTERNAL task plan. Registers a `todo_write` tool on ctx.tools that
# lets the model maintain a structured list of its own sub-steps for multi-step
# work, plus a `todos` projection on ctx.sessionProjections so the list is
# replay-stable. Distinct from our app-level todo.* tools (those manage the
# USER's persistent TODO list in the left pane); this is the agent's scratch
# plan for the current turn.
#
# allowParallelInProgress: false → "exactly one in_progress at a time" matches
# our sequential persona. Flip to true if the model needs to coordinate
# concurrent subagents / background work.
- id: todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: false
