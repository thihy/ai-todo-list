# thihy-todolist DSH composition. Minimal agent tree: base LLM service (we
# register our own ThihyLlmAdapter wrapping client.ts invokeChat after boot),
# tool registry (we register our todo/content/drawing handlers), system prompt,
# session service + projection + JSONL persistence, agent factory, and the
# agent loop. NO bash/editor/sandbox/terminal tools — this is a TODO app, not a
# coding agent; only our own typed domain tools are exposed to the model.
# Configured agents: [] — we create agents programmatically via ctx.agents.create
# per AI invocation, so activation needs no provider adapter at boot time.

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: |-
      你是 thihy，一个内嵌于个人 TODO 列表应用中的 AI 助手。
      - 始终使用中文回复用户。

      ## 工具总览（按场景）
      - 任务 / 笔记 / 绘图
        - todo.*      列表（按状态/优先级/标签/截止日期/搜索过滤）、创建、更新、批量更新、删除、统计
        - content.*   读取 / 写入 / 历史 / 回滚 TODO 的 markdown 正文
        - drawing.*   列出 / 读取 / 保存 / 删除 / 设置缩略图 Excalidraw 绘图
      - 附件
        - inbox.attach / inbox.attachBlob  把磁盘文件或粘贴图片附加到 TODO
      - 对话自身
        - conversation.*   列出 / 创建 / 重命名 / 归档 / 取消归档 / 删除 / 历史
      - 自省
        - ai.health   检查 provider 连通性（shim / 真实）
        - ai.models   当前激活的 provider / model
        - ai.stats    累计花费
      - 人机协作（HITL）
        - ask_user_question     当选择可枚举时暂停问用户（1-4 题，自动 90s 取消）
        - ask_user_approval     在执行不可逆副作用前请求用户允许

      ## 工作原则
      - 当用户询问其任务或工作时，优先调用工具以基于真实数据作答；不要凭空编造任务、id 或内容。
      - 创建任务时用 `tags` 标记类别；用 `dueAt` 设置截止时间。需要拆分时用 `parentId` 把子任务挂到父任务下。
      - 已完成的任务到龄后会被自动归档（默认完成 1 天后；可在设置中调整）。归档不删除 —— 用 `todo.list { archivedOnly: true }` 或 `includeArchived: true` 查看旧/已完成工作；用 `todo.update { archivedAt: null }` 恢复。
      - 跨任务更新（"把未完成的任务全部标记为已完成"、"把这批任务都挂到某个父任务下"）用 todo.batchUpdate。
      - 执行破坏性操作（todo.delete、drawing.delete、content.restoreVersion、conversation.delete）前，先说明你将要做什么，并等待用户明确同意。
      - 当选择是可枚举的几项时（"用哪个 model？"、"哪种风格？"），优先用 ask_user_question 而不是开放式提问 —— 它对用户更快、对你结构化。
      - 在做不可逆副作用前（删除文件、归档对话），用 ask_user_approval 拿到明确允许。
      - 回答简洁，多用要点和短段落；中文。

- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: sessions
  name: '@deepseek-ai/dsh-session'

# Durable on-disk session store: one JSONL log per session, optionally
# Zstandard-compressed (default). Injects `sessions` (the in-memory
# coordinator) on the upstream side and exposes `ctx.sessionPersistence` to
# anything that wants to inspect raw artifacts. Sessions survive a process
# restart, so a future "resume the last conversation" UX only needs to look
# up a SessionId in this root.
#
# The `root` path is dynamic — it has to be an absolute, writable directory
# specific to this user/machine (we put it under <dataDir>/dsh-sessions
# alongside DB/markdown/drawings). The cordis YAML Loader supports a `!!js`
# (primary-tag, `tag:yaml.org,2002:js`) expression scalar that round-trips as
# a `{ __jsExpr: "<js>" }` node the loader then `eval`s at entry activation
# with the loader's scope on the stack — so `process.env.DSH_SESSIONS_ROOT`
# is read at YAML parse time. Main process sets the env var in
# src/main/index.ts BEFORE the DSH container import (so the loader sees it).
# An absent env var surfaces as `undefined` here, which the plugin rejects
# at construction ("root must be a string").
#
# compression: zstd uses Node 22.15+ `node:zlib` Zstandard bindings — works
# under Electron 44 (Node 24.20). On older Node it would throw SyntaxError on
# the `createZstdDecompress` import, which is why this plugin was left out
# before the Electron 33 → 44 upgrade (Stage C1).
- id: session-persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js "process.env.DSH_SESSIONS_ROOT"
    compression: zstd

- id: agents
  name: '@deepseek-ai/dsh-agent'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []

# Log-backed session-title service. Owns the deterministic fallback (first
# eligible user message, capped) and accepts one optional provider for async
# AI-generated titles. Without a provider, titles stay on the fallback path.
# All three caps are required — no defaults supplied by the package.
- id: session-title
  name: '@deepseek-ai/dsh-session-title'
  config:
    fallbackMaxWords: 8
    fallbackMaxBytes: 96
    maxTitleBytes: 120

# LLM-backed title provider. Uses the FIRST eligible user message as the
# summarization input — short, bounded by maxInputBytes / maxOutputTokens,
# with a 15s deadline. The provider inherits the main request's route by
# default (omit provider/model) so title generation uses the same model
# the user configured for the conversation. The result supersedes the
# fallback asynchronously; the main agent run is never delayed by it.
- id: session-title-first-prompt-llm
  name: '@deepseek-ai/dsh-session-title-first-prompt-llm'
  config:
    targetWords: 6
    targetCjkCharacters: 10
    maxInputBytes: 4096
    maxOutputTokens: 64
    timeoutMs: 15000

# Token measurement service. Inject: sessionProjections (already mounted above).
# Injects `tokenMeter` onto ctx for any service that wants to budget context
# (compaction, pruner, agent-loop). Zero config — defaults are fine.
- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

# Deterministic tool-result pruning: when a tool result exceeds thresholdChars,
# keep headChars + marker + tailChars so the model still sees the framing and
# the most recent lines but the middle is dropped. Pairs with token-meter.
# Defaults: threshold 8192, head 4096, tail 1024 — fine for our use.
- id: tool-result-pruner
  name: '@deepseek-ai/dsh-compaction-tool-result-pruner'

# Automatic between-step compaction: when pressure > thresholdRatio (0.8 of
# model context) it asks the LLM to summarize the head, retaining the verbatim
# tail so the active work isn't lost. Inject: llm, tokenMeter, sessions — all
# present above. auto: true engages the pressure-driven path; without it the
# engine only runs when the session/compact event fires explicitly.
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    auto: true

# Agent's INTERNAL task plan. Registers a `todo_write` tool on ctx.tools that
# lets the model maintain a structured list of its own sub-steps for multi-step
# work, plus a `todos` projection on ctx.sessionProjections so the list is
# replay-stable. Distinct from our app-level todo.* tools (those manage the
# USER's persistent TODO list in the left pane); this is the agent's scratch
# plan for the current turn.
#
# allowParallelInProgress: false → "exactly one in_progress at a time" matches
# our sequential persona. Flip to true if the model needs to coordinate
# concurrent subagents / background work.
- id: todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: false

# Web access seam. Provides ctx.web (a `searchProvider`+`fetchProvider` seam)
# over which dsh-tool-web registers model-facing web_search + web_fetch tools.
# fetchProvider: "http" — resolved to dsh-web-fetch-http below (id:"http").
# searchProvider: "deepseek-official" — dsh-web-search-deepseek is NOT mounted
# (it requires the real DeepSeek Anthropic-compatible Messages endpoint with
# the `web_search_20250305` server tool + dsh-credentials). dsh-web stores the
# id at boot and only resolves it at call time, so an unknown id boots clean
# and the model gets a WebError when (if) it tries web_search.
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    fetchProvider: http
    searchProvider: deepseek-official

# Public HTTP(S) fetch provider. Address-pinned transport (no DNS-rebind to
# private ranges), 5 MiB cap, 30s timeout, 5 redirects. Defaults are sensible.
- id: web-fetch-http
  name: '@deepseek-ai/dsh-web-fetch-http'

# Model-facing web_search + web_fetch over ctx.web. Inject: [tools, web,
# systemPrompt] — all present. Default tool-call timeouts are fine.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'

# Skill registry: providers register reusable agent behaviors (named prompt
# fragments / scripts / tool packs) on `ctx.skills`; the model can load any
# scoped skill via the dsh-tool-skill loader below. Config has only one
# optional knob (collectCacheMaxEntries) — default is fine.
- id: skill
  name: '@deepseek-ai/dsh-skill'

# Filesystem skill provider: watches `~/.dsh/skills` and `~/.agents/skills` (and
# any customSkillDirs) via chokidar, registers each discovered skill on
# ctx.skills. dshHome/agentsHome are required by the schema; empty strings fall
# through to defaults — `resolveDshHome('')` → `~/.dsh`, agentsHome → `~/.agents`.
# If those dirs don't exist chokidar just sits on them silently (no events).
# Add `customSkillDirs: ['<path>']` to ship a private app-owned skill catalog.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    dshHome: ''
    agentsHome: ''

# Model-facing skill loader: registers the tool that lets the agent pick +
# load a skill at runtime, plus a durable session catalog projection so
# skill picks are replay-stable. Inject: [agents, tools, skills] — all present.
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# Human-in-the-loop questions. `ctx.userQuestions` is the seam; the waterfall
# listener registered in src/main/dsh/dsh-runtime.ts bridges `ask()` calls
# to the Electron renderer via the `ai:user-question-request` / `answer`
# IPC channels. The model sees the model-facing `ask_user_question` tool
# below (dsh-tool-ask-user), which calls `ctx.userQuestions.ask()` under
# the hood. No config knobs; the seam is its own service definition.
- id: user-questions
  name: '@deepseek-ai/dsh-user-questions'

# Approval seam for destructive / sensitive operations. Same answerer
# pattern as user-questions: `ctx.approval.request()` lands in the
# `approval/request` waterfall, which our runtime listener bridges to
# the renderer as `ai:user-approval-request` / `answer`. Fail-closed when
# no answerer accepts; default policy is `ask`. The interactive-policy
# system-prompt snippet is added by the service itself (no model prompt
# fragment needed here).
- id: user-approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask

# Model-facing `ask_user_question` tool. Injects [tools, userQuestions] —
# both present above. The tool pauses the agent loop until
# `ctx.userQuestions.ask()` resolves with the user's answer, then feeds
# that answer back as an ordinary tool result. Tool registration is
# self-contained (no schema knobs).
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
