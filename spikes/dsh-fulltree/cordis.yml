# Minimal agent composition for the in-process spike: base LLM service (no
# provider plugin — we register our own LlmAdapter after boot), tool registry,
# system prompt, session service + projection + JSONL persistence, agent
# factory, and the agent loop with NO configured agents (so activation does
# not require a registered adapter). Proves the plugin tree mounts and the
# five injected services (agents/sessions/llm/tools/systemPrompt) come alive.

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: 'You are thihy, an AI assistant inside a personal TODO list app.'

- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: sessions
  name: '@deepseek-ai/dsh-session'

- id: session-persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.cwd() + '/.dsh-sessions'

- id: agents
  name: '@deepseek-ai/dsh-agent'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []
